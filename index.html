<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/images/BlueTides_tiny.png" />
    <link rel="stylesheet" href=".\styles\css\style.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlueTides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Seaweed+Script&family=Sail&family=Aguafina+Script&family=Kaushan+Script&family=Damion&family=Courgette&family=Sacramento&family=Lobster&family=Dancing+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a
          href="#/feed?tab=general"
          class="navbar-brand d-flex align-items-center text-decoration-none"
        >
          <img
            src="/images/BlueTides.png"
            alt="BlueTides logo"
            class="me-3 img-fluid"
          />
          <h1 class="brand mb-0 text-primary brand-text">BlueTides</h1>
        </a>
        <div class="d-flex align-items-center gap-3">
          <a href="#/create" class="btn btn-primary">New post</a>

          <div class="dropdown">
            <button
              id="profile-btn"
              class="btn btn-link dropdown-toggle p-0 border-0 d-flex align-items-center"
              type="button"
              data-bs-toggle="dropdown"
              data-bs-boundary="viewport"
              data-bs-auto-close="true"
              aria-expanded="false"
            >
              <img
                id="profile-avatar"
                src="https://placehold.co/64x64"
                alt="Profile"
                width="48"
                height="48"
                class="rounded-circle"
              />
              <span
                id="login-text"
                class="ms-2 text-dark text-decoration-none d-none"
                >Login</span
              >
            </button>
            <ul
              id="profile-dropdown"
              class="dropdown-menu dropdown-menu-end shadow-sm dropdown-menu-end-custom"
            >
              <li>
                <a href="#/login" id="login-link" class="dropdown-item"
                  >Login</a
                >
              </li>
              <li>
                <a href="#/profile" class="dropdown-item">View Profile</a>
              </li>
              <li>
                <hr class="dropdown-divider" />
              </li>
              <li>
                <button id="logout-btn" class="dropdown-item" type="button">
                  Log Out
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <main id="app" class="container py-4" aria-live="polite"></main>
    <script type="module" src="./src/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
