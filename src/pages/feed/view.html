<div class="container py-4">
  <div class="row">
    <div class="col-12">
      <nav class="mb-4" id="feed-tabs">
        <div class="d-flex align-items-center gap-3">
          <label for="feed-select" class="text-muted mb-0">Choose feed:</label>
          <select id="feed-select" class="form-select w-auto">
            <option value="general" selected>General</option>
            <option value="following">Following</option>
          </select>
        </div>
      </nav>

      <div class="card mb-4">
        <div class="card-body">
          <form id="search-form" role="search">
            <div class="mb-3">
              <label for="search-input" class="form-label">Search posts</label>
              <input
                id="search-input"
                class="form-control"
                type="search"
                placeholder="Type to search…"
              />
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
          </form>
        </div>
      </div>

      <div id="feed-list" class="row g-3" aria-live="polite"></div>
    </div>
  </div>
</div>
