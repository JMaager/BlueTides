<section class="container py-4">
  <header class="card mb-4">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div class="d-flex gap-3 align-items-center">
          <img
            id="profile-avatar"
            alt="Profile Avatar"
            class="rounded-circle"
            width="64"
            height="64"
            class="cursor-pointer"
          />
          <h2 id="profile-name" class="mb-0">@undefined</h2>
        </div>
        <button id="follow-btn" class="btn btn-primary">Follow</button>
      </div>
      <div class="d-flex gap-4 text-muted">
        <span id="profile-posts-count">0 posts</span>
        <a
          href="#"
          id="profile-followers-count"
          class="text-muted text-decoration-none"
          >0 followers</a
        >
        <a
          href="#"
          id="profile-following-count"
          class="text-muted text-decoration-none"
          >0 following</a
        >
      </div>
    </div>
  </header>

  <section id="profile-bio-card" class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">Bio</h3>
      <p id="profile-bio" class="text-muted mb-0">No bio yet.</p>
    </div>
  </section>

  <h3 class="mb-3">Posts</h3>
  <div id="profile-posts" class="row g-3"></div>
</section>
