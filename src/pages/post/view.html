<div class="container py-4">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h2 id="post-title" class="card-title">Loading...</h2>
          <p id="post-author" class="text-muted mb-3"></p>
          <p id="post-body" class="card-text"></p>
          <div id="post-media" class="mb-3"></div>

          <div class="d-flex align-items-center gap-3 mb-4">
            <button
              id="post-reaction-btn"
              class="btn btn-outline-primary btn-sm"
              type="button"
            >
              ❤️ <span id="post-reactions-count">0</span>
            </button>
            <span class="text-muted">·</span>
            <span id="post-comments-count" class="text-muted">0 comments</span>
          </div>

          <section id="comments-section" class="border-top pt-4">
            <h3 class="h5 mb-3">Comments</h3>

            <form id="comment-form" class="mb-4">
              <div class="mb-3">
                <label for="comment-input" class="form-label"
                  >Add a comment</label
                >
                <textarea
                  id="comment-input"
                  class="form-control"
                  rows="3"
                  required
                  placeholder="Write a comment…"
                ></textarea>
              </div>
              <button id="comment-submit" class="btn btn-primary" type="submit">
                Post comment
              </button>
              <div
                id="comment-error"
                class="alert alert-danger mt-2"
                role="alert"
                hidden
              ></div>
            </form>

            <div id="comments-list"></div>
          </section>

          <div class="d-flex gap-2 mt-4">
            <button
              id="edit-btn"
              class="btn btn-secondary"
              style="display: none"
            >
              Edit
            </button>
            <button id="back-btn" class="btn btn-outline-secondary">
              Back
            </button>
          </div>

          <form id="edit-form" class="mt-4" style="display: none">
            <div class="mb-3">
              <label for="edit-title" class="form-label">Title</label>
              <input name="title" class="form-control" id="edit-title" />
            </div>
            <div class="mb-3">
              <label for="edit-body" class="form-label">Body</label>
              <textarea
                name="body"
                class="form-control"
                id="edit-body"
                rows="5"
              ></textarea>
            </div>
            <div class="mb-3">
              <div class="accordion" id="editMediaAccordion">
                <div class="accordion-item">
                  <h2 class="accordion-header">
                    <button
                      class="accordion-button collapsed"
                      type="button"
                      data-bs-toggle="collapse"
                      data-bs-target="#editMediaCollapse"
                      aria-expanded="false"
                    >
                      Media
                    </button>
                  </h2>
                  <div
                    id="editMediaCollapse"
                    class="accordion-collapse collapse"
                    data-bs-parent="#editMediaAccordion"
                  >
                    <div class="accordion-body">
                      <div class="mb-3">
                        <label for="edit-mediaUrl" class="form-label"
                          >Image URL</label
                        >
                        <input
                          name="mediaUrl"
                          class="form-control"
                          id="edit-mediaUrl"
                          placeholder="https://..."
                        />
                      </div>
                      <div class="mb-3">
                        <label for="edit-mediaAlt" class="form-label"
                          >Alt text</label
                        >
                        <input
                          name="mediaAlt"
                          class="form-control"
                          id="edit-mediaAlt"
                          placeholder="Describe the image"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button id="save-btn" class="btn btn-primary" type="submit">
                Save
              </button>
              <button
                id="cancel-edit-btn"
                class="btn btn-secondary"
                type="button"
              >
                Cancel
              </button>
              <button
                id="delete-btn"
                class="btn btn-danger"
                type="button"
                style="display: none"
              >
                Delete
              </button>
            </div>
            <div
              id="edit-error"
              class="alert alert-danger mt-3"
              role="alert"
              hidden
            ></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
