<div
  class="container d-flex justify-content-center align-items-center min-vh-100"
>
  <div class="card auth-card">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">Create account</h2>
      <form id="register-form">
        <div class="mb-3">
          <label for="name" class="form-label">Display name (no spaces)</label>
          <input
            name="name"
            class="form-control"
            id="name"
            pattern="^\S+$"
            title="No spaces"
            required
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            name="email"
            type="email"
            class="form-control"
            id="email"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label"
            >Password (min 8 chars)</label
          >
          <input
            name="password"
            type="password"
            class="form-control"
            id="password"
            minlength="8"
            required
          />
        </div>
        <button class="btn btn-primary w-100 mb-3" type="submit">
          Create account
        </button>
        <div
          id="register-error"
          class="alert alert-danger"
          role="alert"
          hidden
        ></div>
        <p class="text-center mb-0">
          Already have an account?
          <a href="#/login" class="text-decoration-none">Sign in</a>
        </p>
      </form>
    </div>
  </div>
</div>
